name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest -q --tb=short

      - name: Check sklearn version warning
        run: |
          python -c "
          import warnings, joblib, sklearn
          warnings.simplefilter('error', sklearn.exceptions.InconsistentVersionWarning)
          for m in ['kmeans_k5','scaler','gmm_k5_full']:
              joblib.load(f'data/models/{m}.joblib')
          print('OK: No InconsistentVersionWarning')
          "

  frontend-tests:
    name: Frontend (Build + Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: node --test "tests/*.test.js"

  lint:
    name: Lint (Python + JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install ruff

      - name: Ruff lint
        run: ruff check api/ src/ tests/ --output-format=github

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: ESLint (if config exists)
        run: |
          if [ -f frontend/eslint.config.js ] || [ -f frontend/.eslintrc.* ]; then
            cd frontend && npx eslint src/ --format=github
          else
            echo "No ESLint config found, skipping"
          fi

  notify:
    name: Notify (on failure)
    if: failure()
    needs: [python-tests, frontend-tests, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Log failure
        run: |
          echo "::error::CI failed — check the workflow run for details"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"