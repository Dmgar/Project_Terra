services:
  terra:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-5000}
      TERRA_DB_PATH: /var/data/terra_app.db
      TERRA_COOKIE_SECURE: ${TERRA_COOKIE_SECURE:-false}
      TERRA_COOKIE_SAMESITE: ${TERRA_COOKIE_SAMESITE:-lax}
    volumes:
      - terra_data:/var/data
    restart: unless-stopped

volumes:
  terra_data:
