services:
  - type: web
    name: project-terra
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: terra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TERRA_SECRET_KEY
        generateValue: true
      - key: TERRA_DB_PATH
        value: /var/data/terra_app.db
      - key: TERRA_COOKIE_SECURE
        value: "true"
      - key: TERRA_COOKIE_SAMESITE
        value: lax
      - key: ALLOWED_ORIGINS
        sync: false
